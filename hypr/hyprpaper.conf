# ═══════════════════════════════════════════════════════════════════
# hyprpaper.conf - Wallpaper configuration for hyprpaper
# ═══════════════════════════════════════════════════════════════════

# ─── eDP-1 (Laptop internal display) ──────────────────────────────
wallpaper {
    monitor = eDP-1
    path = /home/vidit68/Downloads/wallpaper.jpg
    fit_mode = cover
}

# ─── HDMI-A-3 (External monitor) ──────────────────────────────────
wallpaper {
    monitor = HDMI-A-3
    path =  /home/vidit68/Downloads/wallpaper.jpg
    fit_mode = cover
}

# ─── Fallback wallpaper (any monitor without a specific config) ───
wallpaper {
    monitor =
    path = /home/vidit68/Pictures/wallpaper.jpg

    fit_mode = cover
}

# ─── Misc options ─────────────────────────────────────────────────
splash = false
